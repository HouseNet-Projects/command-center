name: Command-center CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: command-center-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  policy-gate:
    name: HouseNet policy gate
    uses: HouseNet-Projects/house-net-control-plane/.github/workflows/reusable-policy-gate.yml@b2aecfd3ad3e51d142d09d6adf280c42ebe32c67
  deputy-tests:
    name: Deputy tests and evaluations
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Install locked Deputy runtime
        run: python -m pip install --no-deps -r .claude/runtime/requirements.lock
      - name: Initialize Deputy test workspace (no secrets)
        run: |
          python .claude/policy/sensitive_scan.py --install-hooks
          python .claude/business/build_business_model.py
      - name: Run Deputy tests and evals
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          COMMAND_CENTER_TEST_MODE: '1'
        run: python -m unittest discover -s .claude/tests -v
